name: 每日出圖

on:
  schedule:
    # 每小時一次。GitHub 排程常延遲一兩個小時，跑勤一點才能確保過午夜後很快有新圖
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同時只跑一個；新的排程進來就取消還在跑的舊的，不會被卡住的那次擋住
concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # 套件伺服器沒回應就放棄，等下一小時
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝中文字型與 Chrome
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q fonts-noto-cjk
          echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - name: 產生圖片
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          CAL_ICS_URL: ${{ secrets.CAL_ICS_URL }}
          TZ: Asia/Taipei
        run: python render.py --days 3     # 今天、明天、後天各一張
      - name: 發佈到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false
          force_orphan: true
