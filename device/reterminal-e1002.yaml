# reTerminal E1002 冰箱日曆韌體（ESPHome 2025.11.1 以上）
# 行為：醒來 → 連 Wi-Fi → 抓雲端的 device.png（800×480 六色）→ 顯示 → 深度睡眠到下一個時段
# Wi-Fi 帳密不寫在這裡：刷機後用 web.esphome.io（Improv）或手機連「Fridge-Calendar」熱點設定。
# 綠色重新整理鍵（GPIO3）可隨時喚醒並立即更新。

substitutions:
  image_url: "https://savoirkris.github.io/fridge-almanac/device.png"

esphome:
  name: fridge-calendar
  friendly_name: Fridge Calendar
  on_boot:
    priority: -100
    then:
      - script.execute: main_flow

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0      # 機器的 USB 是外接序列晶片，接在 UART0
  logs:
    captive_portal: WARN    # 預設會把輸入的 Wi-Fi 密碼印在紀錄裡，關掉

wifi:
  ap:
    ssid: "Fridge-Calendar"

captive_portal:

improv_serial:

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Taipei

http_request:
  verify_ssl: false
  timeout: 30s

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

online_image:
  - id: cal_image
    url: ${image_url}
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - logger.log: "Image downloaded, refreshing panel"
      - component.update: epd
      - delay: 45s                 # 彩色面板刷新要十幾秒，留足時間
      - script.execute: go_sleep
    on_error:
      - logger.log: "Image download failed, keeping old picture"
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: 1h

display:
  - platform: epaper_spi
    id: epd
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      it.image(0, 0, id(cal_image));
      // 電池圖示：畫在底部中間。低於 20% 變紅色。
      float v = id(battery_voltage).state;
      if (!isnan(v) && v > 2.5f) {
        float pct = (v - 3.30f) / (4.15f - 3.30f);
        if (pct < 0.0f) pct = 0.0f;
        if (pct > 1.0f) pct = 1.0f;
        Color c = pct < 0.20f ? Color(255, 0, 0) : Color(0, 0, 0);
        const int x = 385, y = 453, w = 28, h = 13;
        it.rectangle(x, y, w, h, c);
        it.rectangle(x + 1, y + 1, w - 2, h - 2, c);
        it.filled_rectangle(x + w, y + 4, 3, h - 8, c);
        int fill = (int) ((w - 6) * pct + 0.5f);
        if (fill > 0) it.filled_rectangle(x + 3, y + 3, fill, h - 6, c);
      }

# 電池：GPIO21 開啟量測電路，GPIO1 讀分壓後的電壓（×2）
output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0

deep_sleep:
  id: sleeper
  wakeup_pin:
    number: GPIO3
    inverted: true
    mode:
      input: true
      pullup: true

script:
  - id: main_flow
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 300s            # 沒設定 Wi-Fi 時醒著 5 分鐘讓人設定
      - if:
          condition:
            wifi.connected:
          then:
            - output.turn_on: battery_enable
            - delay: 4s            # 等 SNTP 對時，也讓電池量測電路穩定
            - component.update: battery_voltage
            - logger.log:
                format: "Battery %.2f V"
                level: INFO
                args: ["id(battery_voltage).state"]
            - output.turn_off: battery_enable
            - component.update: cal_image
          else:
            - logger.log: "No Wi-Fi, sleeping 1h"
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: 1h

  # 睡到下一個時段：01:30、06:30、12:30、18:30（台灣時間）
  - id: go_sleep
    then:
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: !lambda |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return 6 * 3600 * 1000;
            int secs = now.hour * 3600 + now.minute * 60 + now.second;
            const int slots[] = {1 * 3600 + 1800, 6 * 3600 + 1800, 12 * 3600 + 1800, 18 * 3600 + 1800};
            int best = 24 * 3600 + slots[0] - secs;
            for (int s : slots) {
              if (s - secs > 600) { best = s - secs; break; }
            }
            return (uint32_t) best * 1000;
