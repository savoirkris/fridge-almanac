# reTerminal E1002 冰箱日曆韌體（ESPHome 2025.11.1 以上）
# 行為：醒來 → 連 Wi-Fi → 抓雲端的 device.png（800×480 六色）→ 顯示 → 深度睡眠到下一個時段
# Wi-Fi 帳密不寫在這裡：刷機後用 web.esphome.io（Improv）或手機連「Fridge-Calendar」熱點設定。
# 綠色重新整理鍵（GPIO3）可隨時喚醒並立即更新。

substitutions:
  image_base: "https://savoirkris.github.io/fridge-almanac"

esphome:
  name: fridge-calendar
  friendly_name: Fridge Calendar
  on_boot:
    priority: -100
    then:
      - script.execute: main_flow

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0      # 機器的 USB 是外接序列晶片，接在 UART0
  logs:
    captive_portal: WARN    # 預設會把輸入的 Wi-Fi 密碼印在紀錄裡，關掉

wifi:
  ap:
    ssid: "Fridge-Calendar"

captive_portal:

improv_serial:

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Taipei

http_request:
  verify_ssl: false
  timeout: 30s

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

online_image:
  - id: cal_image
    url: ${image_base}/device.png
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - logger.log: "Image downloaded, refreshing panel"
      - component.update: epd
      - delay: 45s                 # 彩色面板刷新要十幾秒，留足時間
      - script.execute: go_sleep
    on_error:
      - logger.log: "Image download failed, keeping old picture"
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: 1h

display:
  - platform: epaper_spi
    id: epd
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      it.image(0, 0, id(cal_image));
      // 電池圖示：畫在右下角。黑框綠底，低於 20% 整個變紅。
      float v = id(battery_voltage).state;
      if (!isnan(v) && v > 2.5f) {
        float pct = (v - 3.30f) / (4.15f - 3.30f);
        if (pct < 0.0f) pct = 0.0f;
        if (pct > 1.0f) pct = 1.0f;
        bool low = pct < 0.20f;
        Color c = low ? Color(255, 0, 0) : Color(0, 0, 0);          // 外框：平常黑、低電量紅
        Color f = low ? Color(255, 0, 0) : Color(0, 255, 0);        // 填滿：平常綠、低電量紅
        const int x = 746, y = 453, w = 21, h = 11;                 // 右下角，更新時間的右邊
        it.rectangle(x, y, w, h, c);
        it.filled_rectangle(x + w, y + 3, 2, h - 6, c);
        int fill = (int) ((w - 4) * pct + 0.5f);
        if (fill > 0) it.filled_rectangle(x + 2, y + 2, fill, h - 4, f);
      }

# 電池：GPIO21 開啟量測電路，GPIO1 讀分壓後的電壓（×2）
output:
  - platform: gpio
    pin: GPIO21
    id: battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    filters:
      - multiply: 2.0

deep_sleep:
  id: sleeper
  wakeup_pin:
    number: GPIO3
    inverted: true
    mode:
      input: true
      pullup: true

script:
  - id: main_flow
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 300s            # 沒設定 Wi-Fi 時醒著 5 分鐘讓人設定
      - if:
          condition:
            wifi.connected:
          then:
            - output.turn_on: battery_enable
            - wait_until:          # 等 SNTP 對時完成（最多 20 秒），日期與睡眠時間都靠它
                condition:
                  time.has_time:
                timeout: 20s
            - delay: 1s            # 讓電池量測電路穩定
            - component.update: battery_voltage
            - logger.log:
                format: "Battery %.2f V"
                level: INFO
                args: ["id(battery_voltage).state"]
            - output.turn_off: battery_enable
            # 依今天日期抓圖（雲端預先做好今天、明天、後天），對不到時間就抓固定檔名
            - online_image.set_url:
                id: cal_image
                url: !lambda |-
                  auto now = id(sntp_time).now();
                  if (!now.is_valid()) return std::string("${image_base}/device.png");
                  char buf[96];
                  snprintf(buf, sizeof(buf), "${image_base}/device-%04d-%02d-%02d.png", now.year, now.month, now.day_of_month);
                  ESP_LOGI("main", "Now %04d-%02d-%02d %02d:%02d, fetching %s", now.year, now.month, now.day_of_month, now.hour, now.minute, buf);
                  return std::string(buf);
            # set_url 會自己開始下載，不必再呼叫 component.update
          else:
            - logger.log: "No Wi-Fi, sleeping 1h"
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: 1h

  # 睡到下一個時段：05:30、12:30（台灣時間），一天醒兩次省電
  - id: go_sleep
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          ESP_LOGI("main", "Sleep calc at %02d:%02d (valid=%d)", now.hour, now.minute, now.is_valid());
      - deep_sleep.enter:
          id: sleeper
          sleep_duration: !lambda |-
            auto now = id(sntp_time).now();
            if (!now.is_valid()) return 6 * 3600 * 1000;
            int secs = now.hour * 3600 + now.minute * 60 + now.second;
            const int slots[] = {5 * 3600 + 1800, 12 * 3600 + 1800};
            int best = 24 * 3600 + slots[0] - secs;
            for (int s : slots) {
              if (s - secs > 600) { best = s - secs; break; }
            }
            return (uint32_t) best * 1000;
