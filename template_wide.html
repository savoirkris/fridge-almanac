<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>日曆</title>
<style>
  /* 800×480 橫式：左邊日期、右邊整天天氣。只用電子紙能顯示的黑、白、紅、黃、藍 */
  :root{--red:#e60012;--yellow:#f5c400;--blue:#0040ff;--ink:#000;--bg:#fff;--accent:#e60012;}
  {{theme_css}}
  html,body{margin:0;width:800px;height:480px;background:var(--bg);color:var(--ink);
    font-family:"Helvetica Neue","Noto Sans TC","PingFang TC",sans-serif;overflow:hidden;}
  .page{box-sizing:border-box;width:800px;height:480px;padding:22px 30px 14px;display:flex;flex-direction:column;}
  .main{flex:1;display:flex;gap:28px;min-height:0;}
  /* 左欄：日期 */
  .left{width:322px;display:flex;flex-direction:column;}
  .head{display:flex;justify-content:space-between;align-items:flex-end;}
  .num{font-size:196px;font-weight:800;line-height:.84;letter-spacing:-8px;margin-left:-6px;}
  .wd{text-align:right;padding-bottom:8px;}
  .wd .en{font-size:31px;font-weight:400;letter-spacing:1px;}
  .wd .zh{font-size:21px;font-weight:500;margin-top:2px;}
  .month{margin-top:16px;display:flex;align-items:baseline;gap:10px;}
  .month .en{font-size:27px;font-weight:600;letter-spacing:3px;}
  .month .zh{font-size:22px;font-weight:400;}
  .month .yr{margin-left:auto;font-size:22px;font-weight:400;letter-spacing:2px;}
  .info{margin-top:auto;height:140px;box-sizing:border-box;border-top:2px solid #000;padding-top:12px;}
  .info .l1{overflow:hidden;font-size:25px;font-weight:500;line-height:1.4;white-space:nowrap;}
  .info .l2{overflow:hidden;font-size:17px;font-weight:400;line-height:1.5;white-space:nowrap;margin-top:3px;}
  .info .hl,.info b{color:var(--accent);font-weight:700;}
  /* 右欄：天氣，刻意比日期安靜 */
  .right{flex:1;display:flex;flex-direction:column;padding-left:22px;}
  .week{display:grid;grid-template-columns:repeat(7,1fr);justify-items:center;row-gap:6px;padding-bottom:14px;border-bottom:2px solid #000;}
  .week .h{font-size:14px;font-weight:600;letter-spacing:1px;}
  .week .h.we{color:var(--accent);}
  .week .d{width:42px;height:42px;line-height:42px;text-align:center;border-radius:50%;font-size:23px;font-weight:500;}
  .week .d.past{font-weight:300;}
  .week .d.hol{color:var(--accent);font-weight:700;}
  .week .d.now{background:var(--accent);color:#fff;font-weight:700;}
  .wxtop{display:flex;align-items:center;gap:14px;white-space:nowrap;margin-top:14px;}
  .wxtop svg{width:64px;height:64px;flex:none;margin-left:-6px;}
  .wxtop .desc{font-size:32px;font-weight:600;}
  .wxtop .temp{margin-left:auto;font-size:32px;font-weight:300;}
  .wxtop > div{display:contents;}
  .meta{margin-top:6px;font-size:17px;font-weight:400;line-height:1.6;white-space:nowrap;display:flex;justify-content:space-between;}
  .slots{margin-top:auto;height:140px;box-sizing:border-box;border-top:2px solid #000;padding-top:12px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;}
  .slot .n{font-size:18px;font-weight:500;letter-spacing:2px;}
  .slot svg{width:46px;height:46px;margin:4px 0 0;}
  .slot .t{font-size:21px;font-weight:600;line-height:1.3;white-space:nowrap;}
  .slot .p{font-size:16px;font-weight:600;color:var(--blue);}
  .slot .p.dry{color:#000;font-weight:400;}
  .foot{margin-top:9px;display:flex;justify-content:space-between;font-size:11px;font-weight:500;letter-spacing:2px;}
</style></head>
<body><div class="page">
  <div class="main">
    <div class="left">
      <div class="head">
        <div class="num">{{day}}</div>
        <div class="wd"><div class="en">{{wd_en}}</div><div class="zh">{{wd_zh}}</div></div>
      </div>
      <div class="month"><span class="en">{{month_en}}</span><span class="zh">{{month_zh}}月</span><span class="yr">{{year}}</span></div>
      <div class="info">
        <div class="l1">{{info_l1}}</div>
        <div class="l1">{{info_l2}}</div>
        <div class="l2">{{next_hol}}</div>
      </div>
    </div>
    <div class="right">
      <div class="week">{{week}}</div>
      <div class="wxtop">{{wx_icon}}<div><div class="desc">{{wx_desc}}</div><div class="temp">{{wx_temp}}</div></div></div>
      <div class="meta">{{wx_meta}}</div>
      <div class="slots">{{slots}}</div>
    </div>
  </div>
  <div class="foot"><span>高雄 · 天氣 {{wx_src}}</span><span>更新 {{updated}}</span></div>
</div></body></html>
